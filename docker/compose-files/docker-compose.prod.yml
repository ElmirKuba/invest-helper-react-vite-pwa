# Сервисы поднимаемые в Docker Compose
services:
  # Сервис traefik reverse proxy manager
  traefik:
    image: traefik:v3.5
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--entrypoints.web.address=:80'
      - '--log.level=DEBUG'
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Сервис frontend приложения
  prod_invest-helper_react-frontend:
    container_name: prod_invest-helper_react-frontend
    build:
      context: ./../../
      dockerfile: ./docker/dockerfiles/react-frontend/Dockerfile.production
    restart: unless-stopped
    environment:
      - PROJECT_STATUS=${DOCKER_MODE}
    # labels:
    expose:
      - 80
    ports:
      - 5553:80
    labels:
      - 'traefik.http.routers.invest_frontend.rule=Host(`${FRONTEND_PUBLIC_URL}`)'
    networks:
      - invest-helper_prod-net
      - invest-helper_proxynet
    # depends_on:

networks:
  invest-helper_prod-net:
    name: invest-helper_prod-net
    external: true

  invest-helper_proxynet:
    name: invest-helper_proxynet
    external: true
